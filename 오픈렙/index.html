<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>버추얼 표정 인식 아바타 (이미지 마스크)</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    #container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video, canvas {
      border-radius: 12px;
    }
    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
    /* 상단 이미지 링크 입력 폼 */
    #image-settings {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      width: 600px;
      box-sizing: border-box;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .input-group label {
      width: 90px;
      text-align: right;
      font-weight: bold;
    }
    .input-group input {
      flex: 1;
      font-size: 13px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #00ffcc;
    }
    /* 하단 상태 표시 바 */
    #status {
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 15px;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <!-- 상단: 표정별 이미지 URL 입력 폼 -->
  <div id="image-settings">
    <div class="input-group">
      <label for="img-normal">😐 일반 URL:</label>
      <input type="text" id="img-normal" value="https://fonts.gstatic.com/s/e/notoemoji/latest/1f431/512.png" placeholder="이미지 링크 입력">
    </div>
    <div class="input-group">
      <label for="img-happy">😀 기쁨 URL:</label>
      <input type="text" id="img-happy" value="https://fonts.gstatic.com/s/e/notoemoji/latest/1f638/512.png" placeholder="이미지 링크 입력">
    </div>
    <div class="input-group">
      <label for="img-sad">😭 슬픔 URL:</label>
      <input type="text" id="img-sad" value="https://fonts.gstatic.com/s/e/notoemoji/latest/1f63f/512.png" placeholder="이미지 링크 입력">
    </div>
    <div class="input-group">
      <label for="img-surprised">😲 놀람 URL:</label>
      <input type="text" id="img-surprised" value="https://fonts.gstatic.com/s/e/notoemoji/latest/1f640/512.png" placeholder="이미지 링크 입력">
    </div>
  </div><br>

  <!-- 중앙: 웹캠 및 아바타 캔버스 -->
  <div id="container">
    <video id="webcam" autoplay playsinline width="640" height="480" style="border:2px solid #00ffcc;"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div><br>

  <!-- 하단: 얼굴 상태 및 감지 데이터 실시간 표시 -->
  <div id="status">1. 카메라 및 AI 로딩 준비 중...</div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

    const status = document.getElementById("status");
    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");

    // URL Input 요소
    const inputNormal = document.getElementById("img-normal");
    const inputHappy = document.getElementById("img-happy");
    const inputSad = document.getElementById("img-sad");
    const inputSurprised = document.getElementById("img-surprised");

    // 이미지 객체 캐싱 관리
    const avatarImages = {
      NORMAL: new Image(),
      HAPPY: new Image(),
      SAD: new Image(),
      SURPRISED: new Image()
    };

    // 이미지 로드 바인딩 함수
    function updateImageSources() {
      avatarImages.NORMAL.src = inputNormal.value;
      avatarImages.HAPPY.src = inputHappy.value;
      avatarImages.SAD.src = inputSad.value;
      avatarImages.SURPRISED.src = inputSurprised.value;
    }

    // Input 변경 이벤트 연결
    inputNormal.addEventListener("change", updateImageSources);
    inputHappy.addEventListener("change", updateImageSources);
    inputSad.addEventListener("change", updateImageSources);
    inputSurprised.addEventListener("change", updateImageSources);

    // 초기 이미지 로드
    updateImageSources();

    let faceLandmarker;
    let lastVideoTime = -1;
    
    // 영점 고정(Calibration Lock) 변수
    let baselineEyebrowDist = null;
    let baselineMouthDist = null;
    let calibrationFrames = 0;
    const CALIBRATION_TOTAL_FRAMES = 15;

    // 이동평균 필터(SMA) 버퍼
    const eyebrowHistory = [];
    const mouthHistory = [];
    const FILTER_SIZE = 5;

    // 이전 표정 및 수치 저장 (프레임 동결용)
    let lastEmotion = "NORMAL 😐";
    let lastEbStr = "+0.000";
    let lastMoStr = "+0.000";

    // 1. 카메라 시작
    navigator.mediaDevices.getUserMedia({ video: true })
      .then((stream) => {
        status.innerText = "2. 카메라 연결 성공! AI 모델 로딩 중...";
        video.srcObject = stream;
        initAIModel();
      })
      .catch((err) => {
        console.error("카메라 에러 발생:", err);
        status.innerText = "❌ 카메라 에러: " + err.name + " - " + err.message;
      });

    // 2. MediaPipe AI 모델 초기화
    async function initAIModel() {
      try {
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          outputFaceBlendshapes: true,
          runningMode: "VIDEO",
          numFaces: 1
        });

        status.innerText = "3. 표정 감지 준비 완료!";
        predictLoop();
      } catch (err) {
        console.error("AI 모델 로딩 에러:", err);
        status.innerText = "❌ AI 모델 로딩 실패: " + err.message;
      }
    }

    // 3. 실시간 프레임 감지 루프
    function predictLoop() {
      try {
        if (faceLandmarker && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const results = faceLandmarker.detectForVideo(video, performance.now());

          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const landmarks = results.faceLandmarks[0];

            // (1) 영점 고정 기반 표정 분석
            const emotion = analyzeEmotion(landmarks);

            // (2) 이미지 기반 아바타 오버레이
            drawAvatar(landmarks, emotion);
          }
        }
      } catch (error) {
        console.error("루프 에러 발생:", error);
      }
      
      requestAnimationFrame(predictLoop);
    }

    // 3D 유클리드 거리 계산 함수 (X, Y, Z)
    function get3DDistance(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dz = (p1.z || 0) - (p2.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    // 배열 평균값 계산 함수
    function getAverage(arr) {
      if (arr.length === 0) return 0;
      return arr.reduce((sum, val) => sum + val, 0) / arr.length;
    }

    // 표정 측정
    function analyzeEmotion(landmarks) {
      const noseTip = landmarks[1];        
      const noseBridge = landmarks[6];     
      const chin = landmarks[152];         
      const topHead = landmarks[10];       
      
      const leftCorner = landmarks[61];    
      const rightCorner = landmarks[291]; 
      const leftEyebrow = landmarks[105]; 
      const rightEyebrow = landmarks[334];
      const leftEyeTop = landmarks[159];
      const leftEyeBottom = landmarks[145];

      // 1. 3D 스케일 정규화
      const faceHeight3D = get3DDistance(chin, topHead);
      const faceWidth3D = get3DDistance(landmarks[454], landmarks[234]);
      const faceScale3D = Math.sqrt(faceHeight3D * faceHeight3D + faceWidth3D * faceWidth3D);

      // 2. 눈 개폐 비율 (눈 감았을 때 동결)
      const eyeOpenHeight = get3DDistance(leftEyeBottom, leftEyeTop) / faceScale3D;
      const isEyeClosed = eyeOpenHeight < 0.012; 

      if (isEyeClosed) {
        status.innerText = `현재 표정: ${lastEmotion} | 눈썹축: ${lastEbStr} | 입술축: ${lastMoStr} (눈 감음 동결 🙈)`;
        return lastEmotion;
      }

      // 좌우 대칭 평균 포인트
      const avgEyebrow = {
        x: (leftEyebrow.x + rightEyebrow.x) / 2,
        y: (leftEyebrow.y + rightEyebrow.y) / 2,
        z: ((leftEyebrow.z || 0) + (rightEyebrow.z || 0)) / 2
      };

      const avgCorner = {
        x: (leftCorner.x + rightCorner.x) / 2,
        y: (leftCorner.y + rightCorner.y) / 2,
        z: ((leftCorner.z || 0) + (rightCorner.z || 0)) / 2
      };

      // 3. 현재 3D 위치 측정
      const eyebrowDist3D = get3DDistance(noseBridge, avgEyebrow) / faceScale3D;
      const eyebrowSign = (noseBridge.y > avgEyebrow.y) ? 1 : -1;
      const currentEyebrowVal = eyebrowDist3D * eyebrowSign;

      const mouthDist3D = get3DDistance(noseTip, avgCorner) / faceScale3D;
      const mouthSign = (noseTip.y > avgCorner.y) ? 1 : -1;
      const currentMouthVal = mouthDist3D * mouthSign;

      // 4. 초기 15프레임 영점 측정 후 완전 고정
      if (calibrationFrames < CALIBRATION_TOTAL_FRAMES) {
        if (baselineEyebrowDist === null) {
          baselineEyebrowDist = currentEyebrowVal;
          baselineMouthDist = currentMouthVal;
        } else {
          baselineEyebrowDist = (baselineEyebrowDist * calibrationFrames + currentEyebrowVal) / (calibrationFrames + 1);
          baselineMouthDist = (baselineMouthDist * calibrationFrames + currentMouthVal) / (calibrationFrames + 1);
        }
        calibrationFrames++;
        status.innerText = `영점 측정 중... (${calibrationFrames}/${CALIBRATION_TOTAL_FRAMES})`;
        return "NORMAL 😐";
      }

      // 5. 영점 대비 변화량 (Vector)
      let rawEbVector = currentEyebrowVal - baselineEyebrowDist;
      let rawMoVector = currentMouthVal - baselineMouthDist;

      // 센서 미세 떨림 데드존(±0.0015) 적용
      if (Math.abs(rawEbVector) < 0.0015) rawEbVector = 0;
      if (Math.abs(rawMoVector) < 0.0015) rawMoVector = 0;

      // 6. 노이즈 필터링
      eyebrowHistory.push(rawEbVector);
      mouthHistory.push(rawMoVector);
      if (eyebrowHistory.length > FILTER_SIZE) eyebrowHistory.shift();
      if (mouthHistory.length > FILTER_SIZE) mouthHistory.shift();

      const eyebrowVector = getAverage(eyebrowHistory);
      const mouthVector = getAverage(mouthHistory);

      let emotion = "NORMAL 😐";

      // 표정 판정 조건
      if (eyebrowVector >= 0.007) {
        emotion = "SURPRISED 😲";
      } else if (mouthVector >= 0.003) {
        emotion = "HAPPY 😀";
      } else if (eyebrowVector < -0.006 || mouthVector < -0.005) {
        emotion = "SAD 😭";
      }

      // 하단 표시용 데이터 저장 및 갱신
      lastEmotion = emotion;
      lastEbStr = (eyebrowVector >= 0 ? "+" : "") + eyebrowVector.toFixed(3);
      lastMoStr = (mouthVector >= 0 ? "+" : "") + mouthVector.toFixed(3);

      status.innerText = `현재 표정: ${emotion} | 눈썹축: ${lastEbStr} | 입술축: ${lastMoStr}`;
      return emotion;
    }

    // 얼굴 전체에 이미지 마스크 렌더링
    function drawAvatar(landmarks, emotion) {
      const noseCenter = landmarks[1];
      const x = noseCenter.x * canvasElement.width;
      const y = noseCenter.y * canvasElement.height;

      const topHead = landmarks[10];
      const bottomChin = landmarks[152];
      const faceHeightPx = Math.abs(bottomChin.y - topHead.y) * canvasElement.height;

      // 이미지 크기 계산 (얼굴 세로 길이 기준)
      const size = Math.round(faceHeightPx * 1.5);

      // 감정 상태별 이미지 선택
      let targetImg = avatarImages.NORMAL;
      if (emotion.includes("HAPPY")) targetImg = avatarImages.HAPPY;
      if (emotion.includes("SAD")) targetImg = avatarImages.SAD;
      if (emotion.includes("SURPRISED")) targetImg = avatarImages.SURPRISED;

      // 이미지가 로드된 경우 캔버스 중심 기준 렌더링
      if (targetImg && targetImg.complete && targetImg.naturalWidth !== 0) {
        canvasCtx.drawImage(
          targetImg,
          x - size / 2,
          y - size / 2,
          size,
          size
        );
      }
    }
  </script>
</body>
</html>
